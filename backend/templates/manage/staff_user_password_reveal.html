{% extends 'manage/base.html' %}

{% block content %}
<div class="page-head">
  <div><h1>Password Reset</h1></div>
</div>

<div class="confirm-box" style="max-width:560px;">
  <p style="font-size:14px; margin-bottom:20px;">
    Here's the new password for <b>{{ created_email }}</b>. <b>Copy it down now</b> and pass it to them securely
    — it won't be shown again.
  </p>
  <div class="form-group">
    <label class="form-label">New Password</label>
    <input type="text" class="form-input" value="{{ created_password }}" readonly onclick="this.select()" style="font-family:monospace;">
  </div>
  <div class="form-actions">
    <a href="{% url 'manage:staff_users' %}" class="btn btn-primary">Done</a>
  </div>
</div>
{% endblock %}
