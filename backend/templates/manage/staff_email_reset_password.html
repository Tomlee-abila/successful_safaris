{% extends 'manage/base.html' %}

{% block content %}
<div class="confirm-box">
  <h1 style="font-family:'Playfair Display',serif; font-size:20px; color:var(--green-dark); margin-bottom:12px;">Reset password for {{ email }}?</h1>
  <p style="font-size:14px; margin-bottom:20px;">
    A new random password will be generated and shown once. Anything signed in with the old password
    (mail apps, webmail) will need the new one.
  </p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions" style="border-top:none; padding-top:0; margin-top:0;">
      <button type="submit" class="btn btn-primary">Reset Password</button>
      <a href="{% url 'manage:staff_emails' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
