{% extends 'manage/base.html' %}

{% block content %}
<div class="page-head">
  <div><h1>Add Staff Email</h1></div>
  <a href="{% url 'manage:staff_emails' %}" class="btn btn-secondary">&larr; Back to list</a>
</div>

<form method="post" class="form-card">
  {% csrf_token %}
  <div class="form-group">
    <label class="form-label">Email Address</label>
    <div style="display:flex; align-items:center; gap:8px;">
      <input type="text" name="local_part" class="form-input" placeholder="e.g. bookings" required
        pattern="[a-z0-9][a-z0-9._-]{0,63}" style="max-width:220px;">
      <span style="font-weight:600; color:var(--gray-mid);">@{{ domain }}</span>
    </div>
    <p class="form-help">Lowercase letters, numbers, dots, underscores or hyphens only — e.g. "bookings", "careers", "sarah".</p>
  </div>
  <div class="form-group">
    <label class="form-label">Mailbox Size (MB)</label>
    <input type="number" name="quota_mb" class="form-input" value="1024" min="100" style="max-width:220px;">
    <p class="form-help">1024 MB (1 GB) is enough for most staff mailboxes.</p>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Create Mailbox</button>
    <a href="{% url 'manage:staff_emails' %}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
